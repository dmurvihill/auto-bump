# Issues to keep open. Add one entry per issue.
#
# stale_labels: the bot is considered to have flagged the issue if it has
#   any of these labels. Only then is a comment posted.
# message: the comment to post (can be overridden per issue).
defaults:
  stale_labels:
    - stale
  message: "Leave open please"

issues:
  # stream.Transform limitations on backpressure handling after stream is ended
  - url: https://github.com/nodejs/node/issues/49302
