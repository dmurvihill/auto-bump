name: Bump stale issues

on:
  schedule:
    - cron: "17 14 * * *" # daily, 14:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print actions without commenting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comment on stale-flagged issues
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: ./scripts/bump.sh issues.yml
